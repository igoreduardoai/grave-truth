name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the package and the browser extra
        run: python -m pip install -e ".[dev,validation]"
      - name: Install Chromium for the contrast test
        run: python -m playwright install --with-deps chromium
      - name: Install axe-core
        working-directory: validation
        run: npm ci
      - name: Run the suite
        run: python -m pytest -q
